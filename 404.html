<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; media-src 'self' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b3d1a" />
  <meta name="msapplication-TileColor" content="#0b3d1a" />
  <title>Page introuvable | Zepoul Ayiti</title>
  <meta name="description" content="La page demandée est introuvable. Retournez vers l’accueil de Zepoul Ayiti ou transmettez une demande de cotation." />
  <meta name="robots" content="noindex,follow" />
  <link rel="canonical" href="https://www.zepoulayiti.com/404.html" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <script src="theme.js?v=20260511-dark"></script>
  <link rel="stylesheet" href="site.css?v=20260731-systems1" />
  <style>
    :root {
      --primary: #1a7f37;
      --primary-dark: #0b3d1a;
      --accent: #fbc531;
      --text-main: #1b1b1b;
      --text-muted: #5f6a67;
      --surface: #ffffff;
      --surface-soft: #f7fbf8;
      --border: rgba(11, 61, 26, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Plus Jakarta Sans", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(900px 360px at 12% -8%, rgba(251, 197, 49, 0.16), transparent),
        radial-gradient(900px 420px at 92% 0%, rgba(26, 127, 55, 0.12), transparent),
        var(--surface-soft);
    }

    .error-card {
      width: min(760px, 100%);
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: clamp(28px, 5vw, 44px);
      text-align: center;
      box-shadow: 0 24px 54px rgba(11, 61, 26, 0.12);
    }

    .error-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }

    .error-logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 16px;
      display: block;
      border-radius: 18px;
      border: 1px solid rgba(26, 127, 55, 0.14);
      background: #ffffff;
      object-fit: contain;
      box-shadow: 0 14px 28px rgba(11, 61, 26, 0.1);
    }

    .error-kicker {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-family: "Playfair Display", serif;
      font-size: clamp(2.1rem, 5vw, 3rem);
      line-height: 1.1;
      color: var(--primary-dark);
      letter-spacing: -0.03em;
    }

    p {
      max-width: 58ch;
      margin: 0 auto;
      color: var(--text-muted);
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 12px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 800;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 14px 28px rgba(26, 127, 55, 0.2);
    }

    .btn-secondary {
      background: #ffffff;
      color: var(--primary-dark);
      border: 2px solid rgba(26, 127, 55, 0.22);
    }

    @media (max-width: 560px) {
      .actions .btn { width: 100%; }
    }

    @media (prefers-color-scheme: dark) {
      .error-card {
        background: rgba(8, 8, 8, 0.96);
        border-color: rgba(255, 255, 255, 0.13);
        box-shadow: 0 20px 46px rgba(0, 0, 0, 0.56);
      }

      .error-logo,
      .btn-secondary {
        background: #fffdf4;
      }

      h1 { color: #fff8df; }
      p { color: #b9c8be; }
      .error-kicker { color: #9fe7b1; }
    }

    html[data-theme="dark"] .error-card {
      background: rgba(8, 8, 8, 0.96);
      border-color: rgba(255, 255, 255, 0.13);
      box-shadow: 0 20px 46px rgba(0, 0, 0, 0.56);
    }

    html[data-theme="dark"] .error-logo,
    html[data-theme="dark"] .btn-secondary {
      background: #fffdf4;
    }

    html[data-theme="dark"] h1 { color: #fff8df; }
    html[data-theme="dark"] p { color: #b9c8be; }
    html[data-theme="dark"] .error-kicker { color: #9fe7b1; }
  </style>
</head>
<body data-page="error">
  <main class="error-card">
    <img class="error-logo" src="logo-mark.jpg" width="68" height="68" alt="Logo Zepoul Ayiti" data-fallback="logo-optimized.png" />
    <p class="error-kicker">Erreur 404</p>
    <h1>Page introuvable</h1>
    <p>La page demandée n’existe pas ou a été déplacée. Vous pouvez revenir à l’accueil ou transmettre une demande de cotation.</p>
    <div class="actions" aria-label="Actions principales">
      <a class="btn btn-primary" href="index.html">Retour à l’accueil</a>
      <a class="btn btn-secondary" href="index.html#commande">Demande de cotation</a>
    </div>
  </main>

  <script defer src="site.js?v=20260731-systems1"></script>
</body>
</html>
