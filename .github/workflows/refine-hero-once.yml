name: Sharpen homepage hero variants once

on:
  push:
    branches: [image/hero-clarity-20261105]
    paths:
      - .github/workflows/refine-hero-once.yml
      - scripts/refine-hero.py

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image encoders
        run: python -m pip install --disable-pip-version-check "Pillow>=11.1,<12" "pillow-avif-plugin>=1.4,<2"
      - name: Enhance original image and produce exact-size variants
        run: python scripts/refine-hero.py
      - name: Commit image results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-optimized.jpg hero-optimized.avif hero-mobile-520w.avif hero-mobile-360w.jpg
          if git diff --cached --quiet; then
            echo "No image output changes"
            exit 0
          fi
          git commit -m "images: sharpen current homepage hero without changing composition"
          git push origin HEAD:image/hero-clarity-20261105
